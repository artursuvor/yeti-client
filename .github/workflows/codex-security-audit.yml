name: Temporary dependency security audit
on:
  push:
    branches: [codex/security-audit-2026-10-30]
    paths: [.github/workflows/codex-security-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Audit and apply compatible lockfile fixes
        run: |
          node - <<'NODE'
          const fs = require('fs'), cp = require('child_process');
          const dirs = ["."];
          const allowed = [], reports = [];
          function npm(args, cwd) {
            const p = cp.spawnSync('npm', args, {cwd, encoding:'utf8', timeout:240000, maxBuffer:20*1024*1024, env:{...process.env,npm_config_ignore_scripts:'true'}});
            return {status:p.status, output:(p.stdout||'')+(p.stderr||''), stdout:p.stdout||'', error:p.error?.message};
          }
          for (const dir of dirs) {
            const prefix = dir === '.' ? '' : dir + '/';
            const lock = prefix + 'package-lock.json';
            const hadLock = fs.existsSync(lock);
            if (!hadLock) {
              const init = npm(['install','--package-lock-only','--ignore-scripts','--no-audit','--no-fund'], dir);
              if (init.status !== 0) { console.log('AUDIT_ERROR',JSON.stringify({dir,stage:'lockfile',...init})); continue; }
            }
            const beforeResult = npm(['audit','--json'], dir);
            let before;
            try {before = JSON.parse(beforeResult.stdout);} catch {console.log('AUDIT_ERROR',JSON.stringify({dir,stage:'before',...beforeResult}));continue;}
            if (before.error || !before.metadata) {console.log('AUDIT_ERROR',JSON.stringify({dir,stage:'before',report:before}));continue;}
            if (before.metadata.vulnerabilities.total > 0) {
              const fix = npm(['audit','fix','--package-lock-only','--ignore-scripts','--no-fund'], dir);
              if (fix.status !== 0 && fix.status !== 1) console.log('FIX_ERROR',JSON.stringify({dir,...fix}));
            }
            const afterResult = npm(['audit','--json'], dir);
            let after;
            try {after = JSON.parse(afterResult.stdout);} catch {console.log('AUDIT_ERROR',JSON.stringify({dir,stage:'after',...afterResult}));continue;}
            console.log('AUDIT_RESULT',JSON.stringify({dir,hadLock,before:before.metadata.vulnerabilities,after:after.metadata?.vulnerabilities,error:after.error}));
            for (const [name,v] of Object.entries(after.vulnerabilities||{})) {
              console.log('REMAINING',JSON.stringify({dir,name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range}),nodes:v.nodes}));
            }
            allowed.push(lock);
            reports.push({dir,total:after.metadata?.vulnerabilities.total});
          }
          if (allowed.length) {
            cp.execFileSync('git',['add','--',...allowed],{stdio:'inherit'});
            const changed = cp.spawnSync('git',['diff','--cached','--quiet']).status !== 0;
            console.log('LOCKFILES_CHANGED',changed);
            if (changed) {
              cp.execFileSync('git',['config','user.name','github-actions[bot]']);
              cp.execFileSync('git',['config','user.email','41898282+github-actions[bot]@users.noreply.github.com']);
              cp.execFileSync('git',['-c','core.hooksPath=/dev/null','commit','-m','fix: update vulnerable dependency versions'],{stdio:'inherit'});
              cp.execFileSync('git',['push','origin','HEAD:codex/security-audit-2026-10-30'],{stdio:'inherit'});
            }
          }
          NODE
